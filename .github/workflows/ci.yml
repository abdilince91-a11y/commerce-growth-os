name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/commerce_growth_os"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and check Merchant smoke image
        run: |
          docker build -f Dockerfile.merchant-smoke -t merchant-smoke:ci .
          if output="$(docker run --rm merchant-smoke:ci 2>&1)"; then
            echo "Merchant probe unexpectedly succeeded outside Cloud Run"
            exit 1
          fi
          if [ "$output" != "Merchant read-only probe failed." ]; then
            echo "Unexpected Merchant probe output; inspect the failed job without posting credentials"
            exit 1
          fi
