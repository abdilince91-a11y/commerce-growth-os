name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/commerce_growth_os"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build and check Merchant smoke image
        run: |
          docker build -f Dockerfile.merchant-smoke -t merchant-smoke:ci .
          docker run --rm --entrypoint /nodejs/bin/node merchant-smoke:ci -e 'const fs = require("node:fs"); if (process.getuid() === 0 || ["/bin/sh", "/bin/bash", "/usr/bin/npm", "/usr/local/bin/npm", "/usr/local/lib/node_modules/npm", "/opt/yarn"].some(p => fs.existsSync(p))) process.exit(1); console.log("Non-root runtime without shell or npm verified.");'
          if output="$(docker run --rm merchant-smoke:ci 2>&1)"; then
            echo "Merchant probe unexpectedly succeeded outside Cloud Run"
            exit 1
          fi
          if [ "$output" != "Merchant read-only probe failed." ]; then
            echo "Unexpected Merchant probe output; inspect the failed job without posting credentials"
            exit 1
          fi

      - name: Scan smoke image for known high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: merchant-smoke:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          timeout: 10m
          cache: false

  verify-windows-script:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse Merchant Cloud Run PowerShell script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/run-merchant-cloud-probe.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
